name: ECU Tests

on:
  push:
    paths:
      - ".gitmodules"
      - "src/JaszczurHAL"
      - "src/common/**"
      - "scripts/**"
      - "tests/**"
      - "runalltests.sh"
      - "runmefirst.sh"
      - "src/ECU/**"
      - ".github/workflows/ecu-tests.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - "src/JaszczurHAL"
      - "src/common/**"
      - "scripts/**"
      - "tests/**"
      - "runalltests.sh"
      - "runmefirst.sh"
      - "src/ECU/**"
      - ".github/workflows/ecu-tests.yml"
  workflow_dispatch:

jobs:
  test-ecu:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read

    steps:
      - name: Checkout Fiesta
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Prepare HAL dependencies
        run: ./src/common/scripts/ensure-jaszczurhal-dependencies.sh src/JaszczurHAL host

      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck valgrind clang-tidy clang-tools

      - name: Test dependency initialization and project tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Configure
        run: |
          cmake -S src/ECU -B src/ECU/build_test \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          cmake --build src/ECU/build_test --parallel

      - name: Run tests
        run: |
          ctest --test-dir src/ECU/build_test --output-on-failure

      - name: Run Valgrind memcheck target
        run: |
          cmake --build src/ECU/build_test --target check-valgrind --parallel

      - name: Run clang-tidy target
        run: |
          cmake --build src/ECU/build_test --target check-clang-tidy --parallel
