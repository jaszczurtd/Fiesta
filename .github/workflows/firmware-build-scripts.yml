name: Firmware Build Scripts

on:
  push:
    paths:
      - "src/ECU/**"
      - "src/Clocks/**"
      - "src/OilAndSpeed/**"
      - "src/Adjustometer/**"
      - "src/Fiesta_clock/**"
      - "src/common/**"
      - ".github/workflows/firmware-build-scripts.yml"
  pull_request:
    paths:
      - "src/ECU/**"
      - "src/Clocks/**"
      - "src/OilAndSpeed/**"
      - "src/Adjustometer/**"
      - "src/Fiesta_clock/**"
      - "src/common/**"
      - ".github/workflows/firmware-build-scripts.yml"
  workflow_dispatch:

jobs:
  verify-build-scripts:
    name: Verify firmware workflow (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - ECU
          - Clocks
          - OilAndSpeed
          - Adjustometer
          - Fiesta_clock
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read

    steps:
      - name: Checkout Fiesta
        uses: actions/checkout@v5

      - name: Clone firmware dependencies
        run: |
          set -eux
          mkdir -p ../libraries

          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/jaszczurtd/JaszczurHAL.git \
            ../libraries/JaszczurHAL

      - name: Setup native RP toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libusb-1.0-0-dev python3
          ../libraries/JaszczurHAL/scripts/ensure_picotool.sh --enable

      - name: Verify release build
        working-directory: src/${{ matrix.module }}
        run: |
          set -eux
          ../../../libraries/JaszczurHAL/vscode/entry/jh-vscode clean --project "$PWD"
          ../../../libraries/JaszczurHAL/vscode/entry/jh-vscode build --project "$PWD"

      - name: Verify debug build
        working-directory: src/${{ matrix.module }}
        run: |
          set -eux
          ../../../libraries/JaszczurHAL/vscode/entry/jh-vscode build-debug --project "$PWD"

      - name: Verify IntelliSense refresh
        working-directory: src/${{ matrix.module }}
        run: |
          set -eux
          ../../../libraries/JaszczurHAL/vscode/entry/jh-vscode refresh-intellisense --project "$PWD"
